# Install as an nginx server configuration. Match the authority and port to plannerctl setup.
server {
    listen 443 ssl;
    server_name planner.example.test;
    ssl_certificate /etc/ssl/planner/fullchain.pem;
    ssl_certificate_key /etc/ssl/planner/privkey.pem;

    if ($http_host !~* "^planner\\.example\\.test(:443)?$") { return 421; }

    location / {
        proxy_pass http://127.0.0.1:27430;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host planner.example.test;
        proxy_set_header X-Forwarded-Host planner.example.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Original-URL "";
        proxy_set_header X-Rewrite-URL "";
        include /etc/nginx/planner-proxy-auth.conf;

        # Board event streams must flush each event and heartbeat as it arrives.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 75s;
    }
}
